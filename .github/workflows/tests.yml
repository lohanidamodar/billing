name: Tests

on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb-2.1.0
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run Pint
        run: composer lint

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        php: ['8.4']
    services:
      mariadb:
        image: mariadb:10.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: billing_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: password
      DB_NAME: billing_test
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mongodb-2.1.0
          coverage: pcov
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Wait for MariaDB
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -ppassword --silent; do
            echo "Waiting for MariaDB..."
            sleep 2
          done
      - name: Run tests
        run: composer test
